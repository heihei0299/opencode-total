<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Analyzer</title>
<style>
:root{color-scheme:dark;--paper:#0b0f10;--panel:#13191b;--panel-2:#182225;--ink:#f3f6f5;--muted:#9aa9a6;--brass:#c5a254;--teal:#10b981;--red:#f43f5e;--rule:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#101719,var(--paper));color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif;min-height:100vh}main{max-width:1180px;margin:0 auto;padding:28px 20px 48px}h1,h2{margin:0;font-family:Georgia,serif}h1{font-size:34px;color:var(--brass)}h1 span{color:var(--ink);font-style:italic}.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.toolbar,.card,.chart,.table-wrap{background:rgba(19,25,27,.9);border:1px solid var(--rule);border-radius:12px;box-shadow:0 10px 28px #0006}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;margin-bottom:14px}.toolbar label{color:var(--muted);font-size:12px}button,select,input{font:inherit;color:var(--ink);background:#0e1416;border:1px solid var(--rule);border-radius:8px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:var(--brass);color:var(--brass)}button:disabled{opacity:.5;cursor:wait}#sync{background:var(--brass);color:#101617;border-color:#e1c270;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:15px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font:700 26px Georgia,serif;color:var(--brass);margin-top:8px;overflow-wrap:anywhere}.chart,.table-wrap{margin-top:14px;padding:16px}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.chart-head h2{font-size:18px}.chart canvas{width:100%;height:300px;background:#0e1315;border-radius:8px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}th{color:var(--brass);font-size:11px;text-align:right}th:first-child,td:first-child{text-align:left}.table-scroll{overflow:auto}.pager{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:12px}.pager span:first-of-type{flex:1}.status{min-height:22px;color:var(--muted);font-size:12px}.error{color:#ff9bab}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{padding:20px 12px}.cards{grid-template-columns:1fr}.value{font-size:22px}}
</style>
</head>
<body>
<main>
  <header class="head"><div><h1><span>OpenCode</span> Analyzer</h1><div class="sub">独立云端用量归档与本地 Pi 对账面板</div></div><div id="status" class="status">从本地缓存加载…</div></header>
  <div class="toolbar"><label>月份 <input id="month" type="month"></label><button id="sync">🔄 立即同步</button><span id="sync-status" class="status"></span></div>
  <section class="cards" aria-label="audit summary">
    <div class="card"><div class="label">本地 Pi</div><div id="local" class="value">—</div><div id="local-sub" class="sub">按月统计</div></div>
    <div class="card"><div class="label">OpenCode 官方</div><div id="remote" class="value">—</div><div id="remote-sub" class="sub">官方账单</div></div>
    <div class="card"><div class="label">差额</div><div id="diff" class="value">—</div><div id="diff-sub" class="sub">官方 − 本地</div></div>
    <div class="card"><div class="label">已同步</div><div id="count" class="value">—</div><div id="last" class="sub">记录数</div></div>
  </section>
  <section class="chart"><div class="chart-head"><h2>月度成本 · 按模型</h2><span id="chart-status" class="sub"></span></div><canvas id="cost-chart" width="960" height="300"></canvas><div id="legend" class="legend"></div></section>
  <section class="table-wrap"><div class="chart-head"><h2>使用历史</h2><label>模型 <select id="model"><option value="">全部模型</option></select></label></div><div class="table-scroll"><table id="history"><thead><tr><th>日期</th><th>模型</th><th>输入</th><th>缓存</th><th>输出</th><th>推理</th><th>成本</th><th>会话 ID</th></tr></thead><tbody><tr><td colspan="8">加载中…</td></tr></tbody></table></div><div class="pager"><button id="prev">上一页</button><span id="page-info">—</span><button id="next">下一页</button><label>每页 <select id="size"><option>20</option><option>50</option><option>100</option></select></label></div></section>
</main>
<script>
"use strict";
const state={year:new Date().getFullYear(),month:new Date().getMonth()+1,page:1,size:20,model:"",total:0};
const $=id=>document.getElementById(id); const colors=["#c5a254","#10b981","#f43f5e","#7c9aa0","#b07a5b","#7f6bb3","#d28b3d","#4b9aaa"];
const compact=n=>Number(n||0).toLocaleString("en-US");
const money=n=>Number(n||0)===0?"费率未配置":"$"+Number(n||0).toFixed(4);
const scaledCost=n=>Number(n||0)>100?Number(n)/1e8:Number(n||0);
async function request(path,options){const r=await fetch(path,options);let body={};try{body=await r.json()}catch{}if(!r.ok){const e=Error(body.detail||("HTTP "+r.status));e.status=body.status||"failed";throw e;}return body}
function monthText(){return String(state.year).padStart(4,"0")+"-"+String(state.month).padStart(2,"0")}
async function loadCosts(){const data=await request(`/api/opencode/costs?year=${state.year}&month=${state.month}`);drawChart(data.costs);}
async function loadAudit(){const data=await request(`/api/opencode/audit?year=${state.year}&month=${state.month}`);const l=data.localTotals,r=data.opencodeTotals;$('local').textContent=compact(l.totalTokens)+" / "+money(l.cost);$('remote').textContent=compact(r.totalTokens)+" / "+money(r.cost);$('local-sub').textContent=l.requests+" 请求";$('remote-sub').textContent=r.requests+" 请求";$('diff').textContent=(data.diff.tokens>=0?"+":"")+compact(data.diff.tokens);$('diff-sub').textContent=(data.diffRate.tokens*100).toFixed(1)+"% · "+(data.comparison||"");}
async function loadHistory(){const p=new URLSearchParams({page:String(state.page),size:String(state.size)});if(state.model)p.set("model",state.model);const data=await request("/api/opencode/history?"+p);state.total=Number(data.total||0);const body=$("history").querySelector("tbody");if(!data.rows.length){body.innerHTML='<tr><td colspan="8">暂无历史记录</td></tr>'}else body.innerHTML=data.rows.map(r=>{const sid=String(r.sessionID||"-");return `<tr><td>${escapeHtml(r.timeCreated||"-")}</td><td>${escapeHtml(r.model||"-")}</td><td>${compact(Number(r.inputTokens||0)+Number(r.cacheReadTokens||0))}</td><td>${compact(Number(r.cacheReadTokens||0)+Number(r.cacheWrite5mTokens||0)+Number(r.cacheWrite1hTokens||0))}</td><td>${compact(r.outputTokens)}</td><td>${compact(r.reasoningTokens)}</td><td>${money(scaledCost(r.cost))}</td><td title="${escapeHtml(sid)}">${escapeHtml(sid.slice(0,12))}</td></tr>`}).join("");const pages=Math.max(1,Math.ceil(state.total/state.size));$("page-info").textContent=state.total+" 行 · 第 "+state.page+"/"+pages;$("prev").disabled=state.page<=1;$("next").disabled=state.page>=pages;$("count").textContent=state.total+" 条";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function drawChart(wrapper){const canvas=$("cost-chart"),ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const rows=wrapper&&wrapper.usage||[];const dates=[...new Set(rows.map(r=>String(r.date||"unknown").slice(0,10)))].sort();const models=[...new Set(rows.map(r=>r.model||"unknown"))].sort();const map=new Map(dates.map(d=>[d,new Map()]));rows.forEach(r=>{const d=String(r.date||"unknown").slice(0,10),m=r.model||"unknown";map.get(d).set(m,(map.get(d).get(m)||0)+scaledCost(r.totalCost))});let max=0;dates.forEach(d=>{let n=0;map.get(d).forEach(v=>n+=v);max=Math.max(max,n)});max=max||1;const pad={l:55,r:15,t:15,b:30},plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;ctx.fillStyle="#0e1315";ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(255,255,255,.1)";ctx.fillStyle="#9aa9a6";ctx.font="11px monospace";for(let i=0;i<=4;i++){const y=pad.t+plotH-plotH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.textAlign="right";ctx.fillText("$"+(max*i/4).toFixed(2),pad.l-6,y+3)}const step=dates.length?plotW/dates.length:plotW,bar=Math.max(8,Math.min(42,step*.65));dates.forEach((d,i)=>{let y=pad.t+plotH;models.forEach((m,j)=>{const v=map.get(d).get(m)||0;if(!v)return;const bh=v/max*plotH;y-=bh;ctx.fillStyle=colors[j%colors.length];ctx.fillRect(pad.l+i*step+(step-bar)/2,y,bar,bh)});ctx.fillStyle="#9aa9a6";ctx.textAlign="center";ctx.fillText(d.slice(5),pad.l+i*step+step/2,h-8)});$("chart-status").textContent=dates.length+" 天 · "+models.length+" 模型";$("legend").innerHTML=models.map((m,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${escapeHtml(m)}</span>`).join("");}
async function refresh(){ $("status").textContent="从本地缓存加载…";await Promise.allSettled([loadCosts(),loadAudit(),loadHistory()]);$("status").textContent="已加载";}
$("month").value=monthText();$("month").addEventListener("change",e=>{const [y,m]=e.target.value.split("-").map(Number);state.year=y;state.month=m;refresh()});$("model").addEventListener("change",e=>{state.model=e.target.value;state.page=1;loadHistory()});$("size").addEventListener("change",e=>{state.size=Number(e.target.value);state.page=1;loadHistory()});$("prev").addEventListener("click",()=>{if(state.page>1){state.page--;loadHistory()}});$("next").addEventListener("click",()=>{if(state.page<Math.max(1,Math.ceil(state.total/state.size))){state.page++;loadHistory()}});$("sync").addEventListener("click",async()=>{const b=$("sync");b.disabled=true;$("sync-status").textContent="同步中…";try{const r=await request("/api/opencode/sync",{method:"POST",headers:{"content-type":"application/json"},body:"{}"});const status=r.status||"complete",warnings=(r.warnings||[]).join("；");$("sync-status").textContent=status+"：新增 "+r.added+" 条 / 更新 "+(r.updated||0)+" 条 / "+r.pages+" 页"+(warnings?" · "+warnings:"");await refresh()}catch(e){$("sync-status").textContent=(e.status||"failed")+"："+e.message}finally{b.disabled=false}});refresh();request("/api/opencode/history").then(data=>{const models=[...new Set((data.rows||[]).map(r=>r.model).filter(Boolean))].sort();models.forEach(m=>{const o=document.createElement("option");o.value=m;o.textContent=m;$("model").appendChild(o)})}).catch(()=>{});
</script>
</body>
</html>
